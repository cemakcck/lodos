name: CI

on:
  push:
  pull_request:

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
        env:
          MONGOMS_VERSION: 8.0.4
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E
        # Playwright starts an in-memory MongoDB (27019), builds and starts the API (4200) and serves the web build (5280).
        run: npm run test:e2e
        env:
          MONGOMS_VERSION: 8.0.4
      - name: Build
        run: npm run build
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
